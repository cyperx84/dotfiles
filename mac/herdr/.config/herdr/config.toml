onboarding = false

[theme]
name = "terminal"
auto_switch = false

[update]
# herdr is Homebrew's stock build again (reverted from the feat/client-focus
# fork 2026-10-15), so update offers are safe to take. To run the fork again:
# rebase ~/github/herdr feat/client-focus, cargo build --release, then
# mac/scripts/herdr-build.sh switch — and set this back to false, since
# `herdr update` would replace that build.
version_check = true

[keys]
prefix = "ctrl+a"
# Pinned on purpose: aerospace owns alt-space globally, so herdr can never
# receive that key itself. alt+e opens the sesh-bro picker: hammerspoon
# (mac/hammerspoon/.hammerspoon/init.lua) focuses the herdr window from any
# app and posts this chord — rebind here and that script must follow.
goto = "alt+g"

# Keys mirror omarchy/herdr/.config/herdr/config.toml: alt+letter first, the
# tmux-style prefix keys as the second way in. ctrl+h/j/k/l pane focus goes
# through the vim-herdr-navigation plugin below, ctrl+alt+arrows are the
# plain fallback. alt+tab stays as a mac-only extra for last_pane (Hyprland
# owns it on Omarchy, hence alt+t there).

# Config and help
reload_config = ["prefix+shift+r", "prefix+q"]
help = "prefix+?"
detach = ["alt+q", "prefix+d"]
toggle_sidebar = ["alt+b"]

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["alt+s", "prefix+h"]
split_vertical = ["alt+v", "prefix+v"]
close_pane = ["alt+x", "prefix+x", "alt+esc"]
zoom = ["alt+w", "prefix+z"]
last_pane = ["alt+t", "alt+tab", "prefix+;"]

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+r", "prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

rename_pane = "prefix+shift+o"

# Tabs. switch_tab indexes tabs by position (herdr src/workspace.rs
# switch_tab), so alt+1..9 needs no tab-jump plugin.
new_tab = ["alt+c", "prefix+c"]
rename_tab = "prefix+shift+t"
close_tab = ["prefix+shift+x", "prefix+k"]
switch_tab = ["alt+1..9", "prefix+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Workspaces. alt+j/k/l/u/i/o jump to 1..6 via [[keys.command]] below.
new_workspace = ["alt+shift+c", "prefix+shift+c"]
rename_workspace = "alt+r"
close_workspace = "prefix+shift+d"
previous_workspace = ["alt+p", "alt+up"]
next_workspace = ["alt+n", "alt+down"]

[ui]
show_agent_labels_on_pane_borders = true
# Outer terminal title. Hammerspoon's alt+e summon (mac/hammerspoon/.hammerspoon/
# init.lua herdrWindow) finds the herdr Ghostty window by a "herdr" title
# prefix; the default "{hostname}: {workspace}" never matched, so every alt+e
# cold-launched a second Ghostty + session picker instead of sesh-bro.
window_title = "herdr · {workspace}"

# Agents panel as an attention queue -- blocked > done-unseen > working > idle --
# so row 1 is always whoever needs you. Was "spaces", which ordered by workspace
# and made every row look equally urgent (herdr discussions #2761, #2466).
agent_panel_sort = "priority"
# Distinct static glyph per state rather than colour-only dots (herdr 0.8.2).
status_indicators = "symbols"

# Agent counts in the tab bar: the answer to "does anything need me" without
# opening anything. herdr runs this through /bin/sh -lc every interval and
# takes the LAST line of stdout, so the path is absolute and the output is
# one line. See herdr-sesh-bro's README "Zero keypresses" section.
tab_bar_right = [
  { type = "command", command = "/Users/cyperx/github/herdr-sesh-bro/bin/sesh-bro counts", interval_seconds = 2 },
]

# Toast delivery defaults to off, so a state change in a background workspace
# announced itself nowhere. "herdr" draws it inside herdr, no OS permission.
[ui.toast]
delivery = "herdr"

# vim-herdr-navigation: ctrl+h/j/k/l route through the plugin, which detects
# Vim/Neovim in the foreground and forwards the chord; otherwise switches pane.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

# ctrl+l is pane focus, so prefix+ctrl+l sends a real ctrl+l (clear screen)
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"

# alt+e: open the sesh-bro picker popup. Hammerspoon (init.lua) focuses the
# herdr window from any app and posts this chord — keep the two in sync.
[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "sesh-bro.open"
# The picker is a Local plugin, and a plugin key otherwise runs on whichever
# machine the window is showing — on a saved machine, sesh-bro is not there and
# the key does nothing. This switches the window back to Local first. Only the
# fork (~/github/herdr feat/client-focus) reads it; stock herdr ignores the
# field, so on a saved machine alt+e does nothing until that lands upstream.
machine = "local"

# alt+. / alt+, : jump to the next/previous agent that needs you (blocked
# first, then done-unseen). herdr's own next_agent cycles in PANEL order, so
# it only follows urgency if agent_panel_sort = "priority" — and that reorders
# the panel, breaking the stable positions focus_agent's 1..9 rely on (herdr
# discussion #2761). sesh-bro reorders nothing: it reads the snapshot, picks,
# focuses. Punctuation keys because the alt letter row is full and kanata's
# home-row mods make alt+a/s/d/f/j/k/l unreliable as chords.
[[keys.command]]
key = "alt+."
type = "plugin_action"
command = "sesh-bro.next"
description = "jump to the next agent needing attention"

[[keys.command]]
key = "alt+,"
type = "plugin_action"
command = "sesh-bro.prev"
description = "jump to the previous agent needing attention"

# alt+m: toggle the focused workspace's persistent Markdown scratch note.
[[keys.command]]
key = "alt+m"
type = "plugin_action"
command = "herdr-notes.toggle"

# Workspace numbers renumber as spaces open and close, so these follow
# position. alt+digits are tabs (indexed bindings are all-or-nothing 1..9),
# so no 7/8/9 here.

[[keys.command]]
key = "alt+j"
type = "shell"
command = '/opt/homebrew/bin/herdr workspace focus 1'
description = "Space 1"

[[keys.command]]
key = "alt+k"
type = "shell"
command = '/opt/homebrew/bin/herdr workspace focus 2'
description = "Space 2"

[[keys.command]]
key = "alt+l"
type = "shell"
command = '/opt/homebrew/bin/herdr workspace focus 3'
description = "Space 3"

[[keys.command]]
key = "alt+u"
type = "shell"
command = '/opt/homebrew/bin/herdr workspace focus 4'
description = "Space 4"

[[keys.command]]
key = "alt+i"
type = "shell"
command = '/opt/homebrew/bin/herdr workspace focus 5'
description = "Space 5"

[[keys.command]]
key = "alt+o"
type = "shell"
command = '/opt/homebrew/bin/herdr workspace focus 6'
description = "Space 6"

[ui.sound]
enabled = false
