# MacBookPro15,3 speakers are one 4-channel device: FL FR RL RR = left woofer,
# right woofer, left tweeter, right tweeter (same layout as the 15,1 graph in
# lemmyg/t2-apple-audio-dsp). On this machine the right woofer (ch1) is silent
# under Linux even through raw ALSA (it works in macOS). A plain stereo stream
# lands on the two woofers, so only the left side played.
#
# This "Speakers" sink plays the stereo image on the two tweeters and sends
# mono bass (L+R, low-passed) to the left woofer. Bass that low isn't
# directional, so it adds body without pulling the image left. It outranks
# the raw 4-channel sink, so it becomes the default output.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }
                    { type = builtin label = copy name = tweeterL }
                    { type = builtin label = copy name = tweeterR }
                    { type = builtin label = mixer name = bassMix
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin label = bq_lowpass name = bassLP1
                      control = { "Freq" = 450.0 "Q" = 0.707 } }
                    { type = builtin label = bq_lowpass name = bassLP2
                      control = { "Freq" = 450.0 "Q" = 0.707 } }
                ]
                links = [
                    { output = "inL:Out" input = "tweeterL:In" }
                    { output = "inR:Out" input = "tweeterR:In" }
                    { output = "inL:Out" input = "bassMix:In 1" }
                    { output = "inR:Out" input = "bassMix:In 2" }
                    { output = "bassMix:Out" input = "bassLP1:In" }
                    { output = "bassLP1:Out" input = "bassLP2:In" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "bassLP2:Out" "tweeterL:Out" "tweeterR:Out" ]
            }
            capture.props = {
                node.name      = "t2_speakers"
                media.class    = "Audio/Sink"
                audio.channels = 2
                audio.position = [ FL FR ]
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name         = "t2_speakers.output"
                audio.channels    = 3
                audio.position    = [ FL RL RR ]
                target.object     = "alsa_output.pci-0000_04_00.3.HiFi__Speaker__sink"
                stream.dont-remix = true
                node.passive      = true
            }
        }
    }
]
