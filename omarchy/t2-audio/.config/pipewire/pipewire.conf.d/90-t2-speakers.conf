# MacBookPro15,3 speakers are one 4-channel device: FL FR RL RR = left woofer,
# right woofer, left tweeter, right tweeter (same layout as the 15,1 graph in
# lemmyg/t2-apple-audio-dsp). On this machine the right woofer (ch1) is silent
# under Linux even through raw ALSA (it works in macOS). A plain stereo stream
# lands on the two woofers, so only the left side played.
#
# This "Speakers" sink plays the stereo image on the two tweeters and sends
# mono bass (L+R, low-passed) to the left woofer. Bass that low isn't
# directional, so it adds body without pulling the image left. The tweeters
# get the matching high-pass (two biquad stages each side, crossover tuned by
# ear), so they never see the bass they can't reproduce and don't distort on
# it. The tweeter levels differ on purpose: the woofer only sits on the left,
# so the left tweeter is pulled down to keep the image centred.
#
# Clipping/damage protection: gains are staged so no output path can exceed
# 0 dBFS (L+R sum at 0.5 each, driver gains <= 1.0), the woofer is high-passed
# at 50 Hz (excursion it can't turn into sound; Apple's FIR leaves that to
# macOS's speaker protection, which Linux doesn't have), and a -1 dBFS lsp
# limiter sits on every output as a last resort (same 5 ms lookahead on all
# three, so the drivers stay time-aligned). It outranks
# the raw 4-channel sink, so it becomes the default output.
#
# t2-speakers-tune (~/.local/bin) adjusts these controls live and saves them
# back into this file; it rewrites only the values in the control = { } blocks.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }
                    { type = builtin label = bq_highpass name = tweeterL1
                      control = { "Freq" = 745 "Q" = 0.815 } }
                    { type = builtin label = bq_highpass name = tweeterL2
                      control = { "Freq" = 745 "Q" = 0.815 } }
                    { type = builtin label = bq_highpass name = tweeterR1
                      control = { "Freq" = 745 "Q" = 0.815 } }
                    { type = builtin label = bq_highpass name = tweeterR2
                      control = { "Freq" = 745 "Q" = 0.815 } }
                    { type = builtin label = mixer name = bassMix
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin label = bq_lowpass name = bassLP1
                      control = { "Freq" = 745 "Q" = 0.806 } }
                    { type = builtin label = bq_lowpass name = bassLP2
                      control = { "Freq" = 745 "Q" = 0.806 } }
                    { type = builtin label = bq_highpass name = woofHP1
                      control = { "Freq" = 50.0 "Q" = 0.707 } }
                    { type = builtin label = bq_highpass name = woofHP2
                      control = { "Freq" = 50.0 "Q" = 0.707 } }
                    # Per-driver level (and polarity, as a negative gain)
                    { type = builtin label = mixer name = wooferGain
                      control = { "Gain 1" = 1.0 } }
                    { type = builtin label = mixer name = tweeterLGain
                      control = { "Gain 1" = 0.375 } }
                    { type = builtin label = mixer name = tweeterRGain
                      control = { "Gain 1" = 0.6668 } }
                    # Safety limiters, -1 dBFS; alr/boost off so they only
                    # ever act on overs
                    { type = lv2 name = limW
                      plugin = "http://lsp-plug.in/plugins/lv2/limiter_mono"
                      control = { "alr" = 0 "boost" = 0 "th" = 0.891 } }
                    { type = lv2 name = limT
                      plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { "alr" = 0 "boost" = 0 "th" = 0.891 } }
                ]
                links = [
                    { output = "inL:Out" input = "tweeterL1:In" }
                    { output = "inR:Out" input = "tweeterR1:In" }
                    { output = "tweeterL1:Out" input = "tweeterL2:In" }
                    { output = "tweeterR1:Out" input = "tweeterR2:In" }
                    { output = "inL:Out" input = "bassMix:In 1" }
                    { output = "inR:Out" input = "bassMix:In 2" }
                    { output = "bassMix:Out" input = "bassLP1:In" }
                    { output = "bassLP1:Out" input = "bassLP2:In" }
                    { output = "bassLP2:Out" input = "woofHP1:In" }
                    { output = "woofHP1:Out" input = "woofHP2:In" }
                    { output = "woofHP2:Out" input = "wooferGain:In 1" }
                    { output = "wooferGain:Out" input = "limW:in" }
                    { output = "tweeterLGain:Out" input = "limT:in_l" }
                    { output = "tweeterRGain:Out" input = "limT:in_r" }
                    { output = "tweeterL2:Out" input = "tweeterLGain:In 1" }
                    { output = "tweeterR2:Out" input = "tweeterRGain:In 1" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "limW:out" "limT:out_l" "limT:out_r" ]
            }
            capture.props = {
                node.name      = "t2_speakers"
                media.class    = "Audio/Sink"
                audio.channels = 2
                audio.position = [ FL FR ]
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name         = "t2_speakers.output"
                audio.channels    = 3
                audio.position    = [ FL RL RR ]
                target.object     = "alsa_output.pci-0000_04_00.3.HiFi__Speaker__sink"
                stream.dont-remix = true
                node.passive      = true
            }
        }
    }
]
