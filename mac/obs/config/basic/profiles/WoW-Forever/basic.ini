[General]
Name=WoW-Forever

[Output]
Mode=Advanced
FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss
DelayEnable=false
Reconnect=true
RetryDelay=2
MaxRetries=25
BindIP=default
IPFamily=IPv4+IPv6

[Stream1]
IgnoreRecommended=false
EnableMultitrackVideo=false

[AdvOut]
ApplyServiceSettings=true
Encoder=com.apple.videotoolbox.videoencoder.ave.hevc
AudioEncoder=CoreAudio_AAC
UseRescale=false
TrackIndex=1
RecType=Standard
RecFilePath=__HOME__/Movies
RecFormat2=hybrid_mov
RecEncoder=none
RecAudioEncoder=CoreAudio_AAC
RecTracks=1
RecRB=false
Track1Bitrate=160

[Video]
BaseCX=2560
BaseCY=1440
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
ScaleType=lanczos
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
MonitoringDeviceId=default
MonitoringDeviceName=Default
SampleRate=48000
ChannelSetup=Stereo
