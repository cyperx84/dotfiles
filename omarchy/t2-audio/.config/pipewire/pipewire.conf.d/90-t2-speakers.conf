# MacBookPro15,3 speakers are one 4-channel device: FL FR RL RR = left, right,
# left, right, and on this machine the FR driver (ch1) is silent even through
# raw ALSA. A plain stereo stream lands on FL/FR, so only the left side played.
# This stereo sink feeds L to RL and R to RR: the matching left/right pair, so
# both sides are equally loud. It outranks the raw 4-channel sink, so it
# becomes the default output.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Speakers"
            capture.props = {
                node.name      = "t2_speakers"
                media.class    = "Audio/Sink"
                audio.position = [ FL FR ]
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name         = "t2_speakers.output"
                audio.position    = [ RL RR ]
                target.object     = "alsa_output.pci-0000_04_00.3.HiFi__Speaker__sink"
                stream.dont-remix = true
                node.passive      = true
            }
        }
    }
]
