# Personal ghostty deltas, layered on top of Omarchy's own ~/.config/ghostty/config.
#
# Omarchy owns that file and edits it in place: omarchy-display-text-size and
# omarchy-font-set rewrite it with `sed -i` (which replaces a stow symlink with a
# real file), and migrations append to it. So it stays Omarchy's, unstowed, and
# this file is pulled in from the end of it via `config-file`.
#
# Never set font-family or font-size here — those are Omarchy's to change from the
# menu, and re-setting them here would win and silently pin them.

font-feature = "liga"
font-feature = "calt"

# Cursor
cursor-color = #00FF00
cursor-style = block_hollow
cursor-style-blink = true

# Shell integration. Omarchy defaults to `no-cursor,ssh-env`; this drops ssh-env
# (SSH terminfo forwarding) to get the cursor back. Add ssh-env if remote TERM breaks.
shell-integration = zsh
shell-integration-features = cursor,sudo,title

background-opacity = 0.9
mouse-hide-while-typing = true

# Send Shift+Enter as Alt+Enter rather than Omarchy 4's `csi:13;2u`.
keybind = shift+enter=text:\x1b\r

# Path is relative to ~/.config/ghostty/. Not shipped in this repo yet.
custom-shader = shaders/cursor_smear_rainbow.glsl
