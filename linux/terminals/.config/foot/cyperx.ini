# Personal foot deltas, layered on top of Omarchy's own ~/.config/foot/foot.ini.
# foot is the terminal Omarchy 4 actually ships. That file stays Omarchy's —
# omarchy-font-set and omarchy-display-text-size rewrite its `font=` line with
# `sed -i` — and this one is pulled in from the end of it via `include`.
#
# Verified on foot 1.27.0: config is parsed top to bottom, `include` is an inline
# paste, and the last assignment wins. So an include at the end overrides
# everything above it, and a second `include` is accepted.
#
# Never set `font=` here: Omarchy owns the size, and re-setting it would win.

[main]
# ghostty/kitty get this from their own deltas; foot has no equivalent of
# ghostty's block_hollow cursor, so the cursor stays a solid block.

[cursor]
blink=yes
# <text under cursor> <cursor>. Matches ghostty's cursor-color = #00FF00.
# Hardcoded rather than theme-derived — a theme switch will not move it.
color=000000 00ff00

[colors]
# ghostty runs background-opacity = 0.9.
alpha=0.9

[mouse]
hide-when-typing=yes

[text-bindings]
# Send Shift+Return as Alt+Return, matching the ghostty/alacritty deltas, instead
# of Omarchy 4's CSI-u. foot refuses a second binding for a key that is already
# mapped ("Shift+Return already mapped to 'text-binding'"), so Omarchy's sequence
# has to be unbound first. Only \xNN escapes are accepted here — \r is rejected.
\x1b[13;2u=none
\x1b\x0d=Shift+Return
