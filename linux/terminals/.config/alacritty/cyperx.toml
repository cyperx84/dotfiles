# Personal alacritty deltas, layered on top of Omarchy's own
# ~/.config/alacritty/alacritty.toml via general.import.
#
# Never set font.size or font.*.family here — omarchy-display-text-size and
# omarchy-font-set rewrite those in Omarchy's file.
#
# UNVERIFIED: alacritty may give the importing file precedence over its imports,
# in which case a scalar set here loses to the same scalar in Omarchy's file. The
# docs only state that later imports beat earlier ones. Keep this additive until
# someone checks on a machine that actually has alacritty installed.

[keyboard]
# Send Shift+Return as Alt+Return rather than Omarchy 4's "\u001B[13;2u".
bindings = [
  { key = "Return", mods = "Shift", chars = "\u001B\r" },
]
