# Personal kitty deltas, layered on top of Omarchy's own ~/.config/kitty/kitty.conf.
# That file stays Omarchy's (it rewrites font_family/font_size with `sed -i`, and
# migrations append to it — the listen_on line for cwd lookup came in that way);
# this file is pulled in from the end of it via `include`.
#
# Never set font_family or font_size here.

window_padding_height 14
show_window_resize_notification no
single_instance yes
