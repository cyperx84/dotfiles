# "Speakers (DSP)": the MacBookPro15,1 speaker DSP from lemmyg/t2-apple-audio-dsp
# (MIT, FIRs in ~/.local/share/t2-audio/15_1), adapted to this 15,3. Same
# 15-inch 2018 chassis and speakers, but the right woofer is silent under Linux.
#
# The FIRs include the crossover (woofers carry up to ~2 kHz, tweeters above),
# so the left woofer gets L+R through the woofer FIR and each tweeter gets its
# own side through the tweeter FIR. Upstream's bankstown virtual bass (AUR only)
# is left out, and its swh limiter (LADSPA only on Arch) is swapped for the
# lsp stereo limiter that Omarchy's own speaker tunings use.
#
# Lower priority than "Speakers" (90-t2-speakers.conf), so pick it by hand.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (DSP)"
            media.name       = "Speakers (DSP)"
            filter.graph = {
                nodes = [
                    { type = lv2 name = compressor
                      plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
                      control = { "enabled" = 1 "g_in" = 1.0 "g_out" = 1.0
                                  "al" = 0.1258925 "at" = 20.0 "rrl" = 0.00001
                                  "rt" = 200.0 "cr" = 3.0 "kn" = 0.251197
                                  "sla" = 10.0 "mk" = 4.0 } }
                    # alr and boost default on and would make the tone drift
                    # with level; th = -1 dB
                    { type = lv2 name = limiter
                      plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                      control = { "alr" = 0 "boost" = 0 "th" = 0.891 } }
                    # Loudness compensation; their volume is the sink volume
                    { type = lv2 name = ell
                      plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                      control = { "enabled" = 1 "input" = 1.0 "fft" = 4 } }
                    { type = lv2 name = elr
                      plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_mono"
                      control = { "enabled" = 1 "input" = 1.0 "fft" = 4 } }
                    { type = builtin label = copy name = copyL }
                    { type = builtin label = copy name = copyR }
                    # The mixers read through their own copies: a mixer input
                    # sharing a port with a convolver bled L/R into each other
                    { type = builtin label = copy name = wL }
                    { type = builtin label = copy name = wR }
                    { type = builtin label = mixer name = wooferMix
                      control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin label = convolver name = convLW
                      config = { filename = "/home/mbp/.local/share/t2-audio/15_1/woofers-48k.wav" channel = 0 gain = 1.0 } }
                    { type = builtin label = convolver name = convLT
                      config = { filename = "/home/mbp/.local/share/t2-audio/15_1/tweeters-48k.wav" channel = 0 gain = 1.0 } }
                    { type = builtin label = convolver name = convRT
                      config = { filename = "/home/mbp/.local/share/t2-audio/15_1/tweeters-48k.wav" channel = 0 gain = 1.0 } }
                ]
                links = [
                    { output = "compressor:out_l" input = "limiter:in_l" }
                    { output = "compressor:out_r" input = "limiter:in_r" }
                    { output = "limiter:out_l"    input = "ell:in" }
                    { output = "limiter:out_r"    input = "elr:in" }
                    { output = "ell:out"          input = "copyL:In" }
                    { output = "elr:out"          input = "copyR:In" }
                    { output = "copyL:Out"        input = "convLT:In" }
                    { output = "copyR:Out"        input = "convRT:In" }
                    { output = "copyL:Out"        input = "wL:In" }
                    { output = "wL:Out"           input = "wooferMix:In 1" }
                    { output = "copyR:Out"        input = "wR:In" }
                    { output = "wR:Out"           input = "wooferMix:In 2" }
                    { output = "wooferMix:Out"    input = "convLW:In" }
                ]
                inputs  = [ "compressor:in_l" "compressor:in_r" ]
                outputs = [ "convLW:Out" "convLT:Out" "convRT:Out" ]
                capture.volumes = [
                    { control = "ell:volume" min = -65.0 max = 0.0 scale = cubic }
                    { control = "elr:volume" min = -65.0 max = 0.0 scale = cubic }
                ]
            }
            capture.props = {
                node.name      = "t2_speakers_dsp"
                media.class    = "Audio/Sink"
                audio.channels = 2
                audio.position = [ FL FR ]
                priority.session = 1500
                priority.driver  = 1500
            }
            playback.props = {
                node.name         = "t2_speakers_dsp.output"
                audio.channels    = 3
                audio.position    = [ FL RL RR ]
                target.object     = "alsa_output.pci-0000_04_00.3.HiFi__Speaker__sink"
                stream.dont-remix = true
                node.passive      = true
            }
        }
    }
]
