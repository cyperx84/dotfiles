onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "terminal"

auto_switch = false
[theme.custom]
# The active tab is drawn as panel_bg text on an accent background, so panel_bg
# has to be dark for it to read - same colors as status-left's "#[fg=black,bg=blue]"
panel_bg = "black"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# Keys ported from the mac config (alt+letter, bare) sit first in each list; the
# tmux-style prefix keys stay as the second way in. Where the two clash the mac
# key wins: prefix+r is resize (was rename tab), prefix+shift+r reloads (was
# rename workspace; that is alt+r now).
#
# Hyprland owns ALT+TAB, so the mac last_pane key is alt+t here.

# Jump straight to a workspace/session by name
goto = "alt+g"

# Config and help
reload_config = ["prefix+shift+r", "prefix+q"]
help = "prefix+?"
detach = ["alt+q", "prefix+d"]
toggle_sidebar = ["alt+b"]

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["alt+s", "prefix+h"]
split_vertical = ["alt+v", "prefix+v"]
close_pane = ["alt+x", "prefix+x", "alt+esc"]
zoom = ["alt+w", "prefix+z"]
last_pane = ["alt+t", "prefix+;"]

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+r", "prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = ["alt+c", "prefix+c"]
rename_tab = "prefix+shift+t"
close_tab = ["prefix+shift+x", "prefix+k"]
switch_tab = ["alt+1..9", "prefix+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = ["alt+n", "prefix+shift+c"]
rename_workspace = "alt+r"
close_workspace = ["prefix+shift+d", "prefix+shift+k"]
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

# Agents panel as an attention queue: blocked > done-unseen > working > idle,
# so row 1 is always whoever needs you.
agent_panel_sort = "priority"

# Toasts for state changes in background workspaces, drawn inside herdr.
[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

# ctrl+hjkl: herdr panes, handing off to nvim splits (nvim-herdr-navigator)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-navigator.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-navigator.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-navigator.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-navigator.right"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"

# Workspaces live on the harpoon letter set: alt+j/k/l/u/i/o = workspaces 1..6.
# alt+digits are tabs (indexed bindings are all-or-nothing 1..9), so no 7/8/9 here.
# Workspace numbers renumber as spaces open and close, so these follow position.

[[keys.command]]
key = "alt+j"
type = "shell"
command = 'herdr workspace focus 1'
description = "Space 1"

[[keys.command]]
key = "alt+k"
type = "shell"
command = 'herdr workspace focus 2'
description = "Space 2"

[[keys.command]]
key = "alt+l"
type = "shell"
command = 'herdr workspace focus 3'
description = "Space 3"

[[keys.command]]
key = "alt+u"
type = "shell"
command = 'herdr workspace focus 4'
description = "Space 4"

[[keys.command]]
key = "alt+i"
type = "shell"
command = 'herdr workspace focus 5'
description = "Space 5"

[[keys.command]]
key = "alt+o"
type = "shell"
command = 'herdr workspace focus 6'
description = "Space 6"
