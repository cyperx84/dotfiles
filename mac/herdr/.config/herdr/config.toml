key = "alt+4"
type = "shell"
command = 'W=$(/opt/homebrew/bin/herdr workspace list | /opt/homebrew/bin/jq -r ".result.workspaces[]|select(.focused)|.workspace_id"); /opt/homebrew/bin/herdr tab focus $(/opt/homebrew/bin/herdr tab list --workspace "$W" | /opt/homebrew/bin/jq -r ".result.tabs[]|select(.number==4)|.tab_id")'
