onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+a"
# Pinned on purpose: aerospace owns alt-space globally, so herdr can never
# receive that key itself. alt+e opens the sesh-bro picker: hammerspoon
# (mac/hammerspoon/.hammerspoon/init.lua) focuses the herdr window from any
# app and posts this chord — rebind here and that script must follow.
goto = "alt+g"
# focus_pane_* removed: ctrl+h/j/k/l now routed through vim-herdr-navigation
# plugin, which detects Vim/Neovim and forwards the chord instead of always
# intercepting.  See vim-herdr-navigation README for details.
split_vertical = "alt+v"
split_horizontal = "alt+s"
close_pane = "alt+x"
new_tab = "alt+c"
last_pane = "alt+tab"
zoom = "alt+w"
detach = "alt+q"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
resize_mode = "prefix+r"
toggle_sidebar = "alt+b"
reload_config = "prefix+shift+r"
rename_workspace = "alt+r"
new_workspace = "alt+n"
close_workspace = "prefix+shift+d"
# switch_workspace moved off the alt digit row 2026-08: alt+1..6 now switch
# TABS and workspaces live on the harpoon letter set below. Indexed bindings
# are all-or-nothing 1..9 ("indexed keybinding must use 1..9"), so a split
# alt row is only expressible as [[keys.command]] entries.
# switch_workspace = "alt+1..9"

[ui]
show_agent_labels_on_pane_borders = true

# vim-herdr-navigation: ctrl+h/j/k/l route through the plugin, which detects
# Vim/Neovim in the foreground and forwards the chord; otherwise switches pane.
agent_panel_sort = "spaces"
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"

# alt+e: open the sesh-bro picker popup. Hammerspoon (init.lua) focuses the
# herdr window from any app and posts this chord — keep the two in sync.
[[keys.command]]
key = "alt+e"
type = "plugin_action"
command = "sesh-bro.open"

# alt+m: toggle the focused workspace's persistent Markdown scratch note.
[[keys.command]]
key = "alt+m"
type = "plugin_action"
command = "herdr-notes.toggle"

# ---------------------------------------------------------------------------
# alt row, 2026-08. Mirrors the old harpoon layout, which moved to <leader>h in
# ~/.config/nvim/lua/plugins/harpoon.lua on the same day.
#
#   alt+1..6                    focus tab 1-6 in the current workspace
#   alt+j k l u i o 7 8 9       focus workspace (space) 1-9
#
# Workspace and tab numbers are POSITIONAL: they renumber as spaces and tabs
# open and close, so alt+j follows position 1, not a fixed project.
#
# `herdr workspace focus <N>` takes the number directly. `herdr tab focus` does
# NOT — it only accepts a full tab_id like w8A:t1 — hence the jq lookup. Both
# paths are absolute because a detached shell binding does not inherit this
# terminal's PATH; HOME alone is enough for herdr to find the right socket.

[[keys.command]]
key = "alt+1"
type = "shell"
command = 'W=$(/opt/homebrew/bin/herdr workspace list | /opt/homebrew/bin/jq -r ".result.workspaces[]|select(.focused)|.workspace_id"); /opt/homebrew/bin/herdr tab focus $(/opt/homebrew/bin/herdr tab list --workspace "$W" | /opt/homebrew/bin/jq -r ".result.tabs[]|select(.number==1)|.tab_id")'
description = "Tab 1"

[[keys.command]]
key = "alt+2"
type = "shell"
command = 'W=$(/opt/homebrew/bin/herdr workspace list | /opt/homebrew/bin/jq -r ".result.workspaces[]|select(.focused)|.workspace_id"); /opt/homebrew/bin/herdr tab focus $(/opt/homebrew/bin/herdr tab list --workspace "$W" | /opt/homebrew/bin/jq -r ".result.tabs[]|select(.number==2)|.tab_id")'
description = "Tab 2"

[[keys.command]]
key = "alt+3"
type = "shell"
command = 'W=$(/opt/homebrew/bin/herdr workspace list | /opt/homebrew/bin/jq -r ".result.workspaces[]|select(.focused)|.workspace_id"); /opt/homebrew/bin/herdr tab focus $(/opt/homebrew/bin/herdr tab list --workspace "$W" | /opt/homebrew/bin/jq -r ".result.tabs[]|select(.number==3)|.tab_id")'
description = "Tab 3"

